<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found</title>
  <style>
    body { background: #020617; color: #94a3b8; font-family: system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .c { text-align: center; }
    h1 { font-size: 3rem; color: #3b82f6; margin: 0; }
    p { margin-top: 0.5rem; font-size: 0.875rem; }
    a { color: #60a5fa; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
  <script>
    sessionStorage.redirect = location.href;
  </script>
  <meta http-equiv="refresh" content="0;URL='/security/'" />
</head>
<body>
  <div class="c">
    <h1>404</h1>
    <p>Redirecting to home page...</p>
    <a href="/security/">Go to home</a>
  </div>
</body>
</html>
